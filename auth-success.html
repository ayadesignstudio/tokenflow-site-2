<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenFlow — Successfully Logged In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --accent: #6366f1;
            --success: #16a34a;
            --border: #e5e5e5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 56px 48px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 20px 60px -10px rgba(0, 0, 0, 0.08);
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logos row */
        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
        }

        /* Figma logo */
        .logo-figma {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* TokenFlow logo */
        .logo-tf {
            width: 52px;
            height: 52px;
            background: #111111;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .logo-tf img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* Link connector icon */
        .link-icon {
            width: 28px;
            height: 28px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.12);
                opacity: 0.8;
            }
        }

        /* Success checkmark */
        .check-circle {
            width: 48px;
            height: 48px;
            background: #dcfce7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--success);
            animation: pop 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        @keyframes pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: var(--border);
            border-radius: 2px;
            margin: 24px auto;
        }

        .tip {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tip svg {
            flex-shrink: 0;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="card">

        <!-- Logos: Figma ←link→ TokenFlow -->
        <div class="logos">
            <!-- Figma logo -->
            <div class="logo-figma">
                <svg width="24" height="36" viewBox="0 0 38 57" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M19 28.5C19 24.91 21.91 22 25.5 22C29.09 22 32 24.91 32 28.5C32 32.09 29.09 35 25.5 35C21.91 35 19 32.09 19 28.5Z"
                        fill="#1ABCFE" />
                    <path d="M6 41.5C6 37.91 8.91 35 12.5 35H19V41.5C19 45.09 16.09 48 12.5 48C8.91 48 6 45.09 6 41.5Z"
                        fill="#0ACF83" />
                    <path d="M19 9V22H25.5C29.09 22 32 19.09 32 15.5C32 11.91 29.09 9 25.5 9H19Z" fill="#FF7262" />
                    <path d="M6 15.5C6 19.09 8.91 22 12.5 22H19V9H12.5C8.91 9 6 11.91 6 15.5Z" fill="#F24E1E" />
                    <path d="M6 28.5C6 32.09 8.91 35 12.5 35H19V22H12.5C8.91 22 6 24.91 6 28.5Z" fill="#A259FF" />
                </svg>
            </div>

            <!-- Link icon -->
            <div class="link-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                </svg>
            </div>

            <!-- TokenFlow logo -->
            <div class="logo-tf"><img src="assets/logo.png" alt="TokenFlow" /></div>
        </div>

        <!-- Success check -->
        <div class="check-circle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </div>

        <h1>You're successfully logged in</h1>
        <p>Please head back to Figma</p>

        <div class="divider"></div>

        <p class="tip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            You can safely close this tab
        </p>

    </div>
</body>

</html>
