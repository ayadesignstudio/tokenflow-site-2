<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TokenFlow</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-base: #070A13;
            --bg-darker: #0A0F1F;
            --text: #F1F5F9;
            --text-dim: #B8C5D6;
            --accent: #3B82F6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg-base);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-darker) 100%);
        }

        .bg-glow {
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            filter: blur(80px);
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent), #818CF8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        p {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-github {
            background: #24292e;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-github:hover {
            background: #2f363d;
        }

        .btn-google {
            background: white;
            color: #3c4043;
        }

        .btn-google:hover {
            background: #f1f3f4;
        }

        .divider {
            margin: 24px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px var(--accent-glow);
        }

        .token-display {
            display: none;
            margin-top: 20px;
            text-align: left;
        }

        .token-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: monospace;
            word-break: break-all;
            font-size: 12px;
            color: var(--accent);
            margin-top: 8px;
            cursor: pointer;
        }

        .token-box:active {
            opacity: 0.7;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .back-link {
            margin-top: 24px;
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>
    <div class="bg-effects">
        <div class="bg-gradient"></div>
        <div class="bg-glow"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
        </div>

        <div id="login-view">
            <h1>Welcome Back</h1>
            <p>Sign in to manage your TokenFlow account</p>

            <form id="magic-link-form">
                <input type="email" id="email" placeholder="Enter your email" required>
                <button type="submit" class="btn btn-primary" id="send-magic-link">
                    Send Magic Link
                </button>
            </form>
            <p class="error-msg" id="error-msg"></p>
        </div>

        <div id="success-view" style="display: none;">
            <h1>Check your email</h1>
            <p>We sent a magic link to <span id="user-email" style="color:white"></span></p>
            <div style="font-size: 40px; margin: 20px 0;">✉️</div>
            <p style="font-size: 13px;">Click the link in the email to sign in.</p>
        </div>

        <div id="logged-in-view" style="display: none;">
            <h1>You are logged in!</h1>
            <p>Use the key below in the Figma Plugin.</p>

            <div class="token-display" style="display: block;">
                <div
                    style="font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600; color:var(--text-dim)">
                    Your Access Token</div>
                <div class="token-box" id="access-token" title="Click to copy">Loading...</div>
                <div style="font-size:11px; color:#22c55e; margin-top:4px; opacity:0; transition:opacity 0.2s"
                    id="copy-feedback">Copied to clipboard!</div>
            </div>

            <button onclick="handleSignOut()" class="btn btn-github" style="margin-top: 24px;">Sign Out</button>
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // -------------------------------------------------------------------------
        //  REPLACE THESE WITH YOUR ACTUAL KEYS FROM THE SUPABASE DASHBOARD
        // -------------------------------------------------------------------------
        const supabaseUrl = 'https://rvjesddmiksofpfnuyyo.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2amVzZGRtaWtzb2ZwZm51eXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODc3ODIsImV4cCI6MjA4NTM2Mzc4Mn0.cq_CyVoglCkNme16wMmH5MU9ypXdjbAn84UwNaMVDtE';
        // -------------------------------------------------------------------------

        let supabaseClient;
        try {
            // Access the global supabase (from CDN) to create the client
            supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        } catch (e) {
            console.error("Supabase init failed", e);
        }

        const loginView = document.getElementById('login-view');
        const successView = document.getElementById('success-view');
        const loggedInView = document.getElementById('logged-in-view');
        const emailInput = document.getElementById('email');
        const errorMsg = document.getElementById('error-msg');

        // Check initial session
        async function checkSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showLoggedIn(session);
            }
        }

        // Listen for auth changes (e.g. after clicking email link)
        if (supabaseClient) {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    showLoggedIn(session);
                } else if (event === 'SIGNED_OUT') {
                    showLogin();
                }
            });
        }

        function showLoggedIn(session) {
            loginView.style.display = 'none';
            successView.style.display = 'none';
            loggedInView.style.display = 'block';

            // Show the access token (JWT)
            const tokenBox = document.getElementById('access-token');
            tokenBox.textContent = session.access_token;

            tokenBox.onclick = () => {
                navigator.clipboard.writeText(session.access_token);
                const feedback = document.getElementById('copy-feedback');
                feedback.style.opacity = '1';
                setTimeout(() => feedback.style.opacity = '0', 2000);
            };
        }

        function showLogin() {
            loginView.style.display = 'block';
            successView.style.display = 'none';
            loggedInView.style.display = 'none';
        }

        document.getElementById('magic-link-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const btn = document.getElementById('send-magic-link');

            btn.textContent = 'Sending...';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    // Redirect back to this page after login
                    emailRedirectTo: window.location.href
                }
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                btn.textContent = 'Send Magic Link';
                btn.disabled = false;
            } else {
                loginView.style.display = 'none';
                successView.style.display = 'block';
                document.getElementById('user-email').textContent = email;
            }
        });

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
        }

        checkSession();
    </script>
</body>

</html>
